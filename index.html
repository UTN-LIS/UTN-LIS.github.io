<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=./template.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIS - Redirigiendo…</title>
  <link rel="icon" href="./favicon.ico" type="image/png">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      margin:0;
      display:grid;
      place-items:center;
      min-height:100vh;
    }
    main { text-align:center; padding:2rem; }
    .btn {
      display:inline-block;
      margin-top:1rem;
      padding:0.5rem 1rem;
      border:2px solid #0A2540;
      border-radius:8px;
      color:#0A2540;
      text-decoration:none;
    }
    .sr-only {
      position:absolute;
      left:-9999px;
      width:1px;
      height:1px;
      overflow:hidden;
    }
  </style>
  <script>
    // Fallback en caso de que el meta refresh no funcione
    setTimeout(() => {
      if (location.pathname.indexOf('template.html') === -1) {
        window.location.replace('./template.html');
      }
    }, 500);
  </script>
</head>
<body>
  <main>
    <p>Redirigiendo a la nueva versión del sitio…</p>
    <p class="sr-only">Será redirigido automáticamente en un instante.</p>
    <p><a class="btn" href="./template.html">Ir ahora</a></p>
    <noscript>
      <p><strong>Nota:</strong> Su navegador no soporta JavaScript. Use el botón para continuar.</p>
    </noscript>
  </main>
</body>
</html>
